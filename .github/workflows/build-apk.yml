name: Build RayanRahmoun APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.8-bin.zip
          unzip -q gradle-9.8-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-9.8/bin" >> "$GITHUB_PATH"

      - name: Build
        run: gradle assembleDebug

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: RayanRahmoun-APK
          path: app/build/outputs/apk/debug/app-debug.apk
